# sim.yml — ホストシミュレータで各画面のスナップショットを生成し、
# artifact に保存する (デザインの回帰チェック用)。
name: sim

on:
  pull_request:
    paths:
      - 'core/**'
      - 'firmware/components/ui/**'
      - 'sim/**'
      - '.github/workflows/sim.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev
          cmake -S sim -B sim/build \
            -DCONFIG_LV_BUILD_DEMOS=OFF -DCONFIG_LV_BUILD_EXAMPLES=OFF
          cmake --build sim/build -j"$(nproc)"

      - name: Generate screenshots
        run: ./sim/build/snapshot --out sim/screenshots

      # T19: 外部ディレクトリのアプリが本体改変なしでビルドされることを検証
      # (apps/_template を /tmp にコピーして外部アプリとして取り込む)。
      - name: External app build (WATCH_EXTRA_APP_DIRS)
        run: |
          mkdir -p /tmp/ext_apps
          cp -r apps/_template /tmp/ext_apps/tpl_ext
          cmake -S sim -B sim/build-ext             -DWATCH_EXTRA_APP_DIRS=/tmp/ext_apps             -DCONFIG_LV_BUILD_DEMOS=OFF -DCONFIG_LV_BUILD_EXAMPLES=OFF
          cmake --build sim/build-ext -j"$(nproc)"
          # 生成行の id は APP_ID (apps/_template/app.cmake の "template")。
          # ディレクトリ名 tpl_ext ではないので、生成表に app が入ったことを
          # id "template" で確認する。
          grep -q '"template"' sim/build-ext/sas_apps_gen/app_ui.cpp
          ./sim/build-ext/snapshot --out /tmp/shots_ext --theme standard
          test -f /tmp/shots_ext/03_applist.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: sim/screenshots/*.png
